spring.application.name=foodndeliv
server.port=8080

# --- H2 IN-MEMORY DATABASE (pour débloquer tes tests) ---
spring.datasource.url=jdbc:h2:mem:foodndeliv
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# --- Keycloak / IAM (inchangé) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${IAM_HOST:localhost}:${IAM_PORT:8080}/realms/foodndeliv

keycloak.server-url=http://${IAM_HOST:localhost}:${IAM_PORT:8080}
keycloak.realm=foodndeliv
keycloak.client-id=foodndeliv-client
keycloak.client-secret=${IAM_CLIENT_SECRET:secret}
keycloak.username=admin
keycloak.password=${IAM_PASSWORD:admin}
keycloak.target-realm=foodndeliv

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.endpoints.web.exposure.include=*
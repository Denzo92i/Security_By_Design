spring.application.name=foodndeliv
server.port=8080

# --- PostgreSQL (Kubernetes) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodndeliv}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Keycloak / IAM ---
# Utilise jwk-set-uri au lieu de issuer-uri pour éviter la validation de l'issuer
# Le pod accède à Keycloak via le service interne keycloak:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${IAM_HOST:keycloak}:${IAM_PORT:8080}/realms/foodndeliv/protocol/openid-connect/certs

keycloak.server-url=http://${IAM_HOST:keycloak}:${IAM_PORT:8080}
keycloak.realm=foodndeliv
keycloak.client-id=foodndeliv-client
keycloak.client-secret=${IAM_CLIENT_SECRET:PZ9TdMUjcDdWU7phe7cevwYf60vDzbpy}
keycloak.username=admin-user
keycloak.password=${IAM_PASSWORD:admin123}
keycloak.target-realm=foodndeliv

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.endpoints.web.exposure.include=*
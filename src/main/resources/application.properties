spring.application.name=foodndeliv
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodndeliv}
spring.datasource.username=${DB_USER:foodndeliv_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${IAM_HOST:localhost}:${IAM_PORT:8080}/realms/foodndeliv

keycloak.server-url=http://${IAM_HOST:localhost}:${IAM_PORT:8080}
keycloak.realm=foodndeliv
keycloak.client-id=foodndeliv-client
keycloak.client-secret=${IAM_CLIENT_SECRET:secret}
keycloak.username=admin
keycloak.password=${IAM_PASSWORD:admin}
keycloak.target-realm=foodndeliv

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.endpoints.web.exposure.include=*

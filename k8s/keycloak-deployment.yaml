apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: keycloak/keycloak:24.0.0
        args: ["start-dev"]
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        # Configuration pour autoriser la connexion depuis le port-forward
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_URL
          value: "http://localhost:8090"
        - name: KC_HOSTNAME_ADMIN_URL
          value: "http://localhost:8090"
        - name: KC_HTTP_RELATIVE_PATH
          value: "/"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
